<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 晴天咖啡馆</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="app.js"></script>
    <style> body { font-family: 'Inter', system-ui, sans-serif; background-color: #FDFBF7; } </style>
</head>
<body class="min-h-screen bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-amber-50/50 via-white to-white flex flex-col justify-center py-12 sm:px-6 lg:px-8">
    <div class="sm:mx-auto sm:w-full sm:max-w-md text-center">
        <a href="index.html" class="inline-flex items-center justify-center bg-amber-600 p-4 rounded-[2rem] text-white shadow-2xl shadow-amber-600/30 mb-8 hover:rotate-12 transition-transform">
            <i data-lucide="coffee" class="h-10 w-10"></i>
        </a>
        <h2 class="text-4xl font-black text-gray-900 tracking-tight">开启香醇之旅</h2>
        <p class="mt-2 text-sm text-gray-500 font-medium">Please login to start your journey</p>
    </div>

    <div class="mt-10 sm:mx-auto sm:w-full sm:max-w-md">
        <div class="bg-white/70 backdrop-blur-xl py-10 px-8 border border-white shadow-2xl rounded-[3rem] sm:px-12 relative overflow-hidden group">
            <div class="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-amber-400 via-orange-500 to-amber-600"></div>
            
            <form id="loginForm" class="space-y-8">
                <div>
                    <label for="username" class="block text-xs font-black text-amber-800 uppercase tracking-widest mb-2">用户名</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400">
                           <i data-lucide="user" class="w-4 h-4"></i>
                        </div>
                        <input id="username" name="username" type="text" required placeholder="您的账号" class="appearance-none block w-full pl-11 pr-4 py-4 border border-gray-100 rounded-2xl bg-gray-50/50 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500 focus:bg-white transition-all text-sm font-medium">
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-xs font-black text-amber-800 uppercase tracking-widest mb-2">密码</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400">
                           <i data-lucide="lock" class="w-4 h-4"></i>
                        </div>
                        <input id="password" name="password" type="password" required placeholder="••••••••" class="appearance-none block w-full pl-11 pr-4 py-4 border border-gray-100 rounded-2xl bg-gray-50/50 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500 focus:bg-white transition-all text-sm font-medium">
                    </div>
                </div>

                <div>
                    <button id="submitBtn" type="submit" class="w-full flex justify-center items-center py-4 px-6 border border-transparent rounded-[1.5rem] shadow-xl text-sm font-black text-white bg-gray-900 hover:bg-stone-800 active:scale-[0.98] transition-all group/btn">
                        <span id="btnText">立即进入</span>
                        <i data-lucide="arrow-right" class="w-4 h-4 ml-2 transition-transform group-hover/btn:translate-x-1"></i>
                    </button>
                </div>
            </form>
            
            <div class="mt-8 pt-8 border-t border-gray-50 text-center">
                <p class="text-xs text-gray-400 font-medium italic">还没有账号？联系管理员即可开启专属权限</p>
                <a href="index.html" class="inline-block mt-4 text-xs font-black text-amber-600 uppercase tracking-widest hover:text-amber-700 transition-colors">返回首页菜单</a>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            btnText.innerHTML = '正在认证...';
            btn.disabled = true;
            btn.classList.add('opacity-50');

            try {
                const res = await apiFetch('/api.php/api/auth/login', {
                    method: 'POST',
                    body: JSON.stringify({ username, password })
                });
                
                const data = await res.json();
                
                if (res.ok && data.token) {
                    showToast('欢迎回来，' + data.user.username, 'success');
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    setTimeout(() => window.location.href = 'index.html', 1000);
                } else {
                    showToast(data.error || '登录失败，请检查账号密码', 'error');
                }
            } catch (err) {
                showToast('网络开小差了，请稍后重试', 'error');
            } finally {
                btnText.innerHTML = '立即进入';
                btn.disabled = false;
                btn.classList.remove('opacity-50');
            }
        });
    </script>
</body>
</html>
